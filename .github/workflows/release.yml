name: release-images
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/fizzwizzledazzle/pullsift:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/detector.Dockerfile
          push: true
          tags: ghcr.io/fizzwizzledazzle/pullsift-detector:latest
