{{- if .Values.detector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-detector
  labels: { app.kubernetes.io/name: pullsift-detector }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pullsift-detector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pullsift-detector }
    spec:
      containers:
        - name: detector
          image: {{ .Values.detector.image }}
          ports:
            - containerPort: 9310
          resources:
            {{- toYaml .Values.detector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-detector
spec:
  selector: { app.kubernetes.io/name: pullsift-detector }
  ports:
    - port: 9310
{{- end }}
