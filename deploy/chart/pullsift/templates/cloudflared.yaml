{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cloudflared
  labels: { app.kubernetes.io/name: pullsift-cloudflared }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pullsift-cloudflared }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pullsift-cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflared.secretName }}
                  key: TUNNEL_TOKEN
{{- end }}
